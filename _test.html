<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {MeshBVH} from 'three-mesh-bvh';
const el=id=>document.getElementById(id);
const options={
hat:[{label:'SEM BONÉ'},{label:'CAMUFLADO',key:'cap_camo',id:4,mode:'cap'},{label:'XADREZ',key:'cap_plaid',id:5,mode:'cap'},{label:'ONCINHA',key:'cap_leopard',id:6,mode:'cap'},{label:'ONCINHA P&B',key:'cap_leopard',id:7,mode:'cap',mono:true}],
top:[{label:'SEM CAMISA'},{label:'JAQUETA CREME',key:'jacket_cream',id:3,mode:'shirt'},{label:'RENDA *',key:'jacket_cream',id:2,mode:'shirt',reference:true},{label:'CAMISA MODULAR *',key:'jacket_cream',id:1,mode:'shirt',reference:true}],
bottom:[{label:'SEM CALÇA'},{label:'CARGO',key:'pants_cargo',id:8,mode:'pants'},{label:'CARGO PRETA',key:'pants_black',id:9,mode:'pants'},{label:'BERMUDA *',key:'pants_cargo',id:1,mode:'shorts',reference:true},{label:'BERMUDA + SAIA *',key:'pants_cargo',id:0,mode:'shortskirt',reference:true}],
full:[{label:'SEM JARDINEIRA'},{label:'JARDINEIRA CREME',key:'overalls_cream',id:1,mode:'overalls'},{label:'VESTIDO *',key:'overalls_cream',id:0,mode:'dress',reference:true}]
};
const slots=['hat','top','bottom','full'],selected={hat:1,top:1,bottom:1,full:0},attached={},cache=new Map(),pending=new Map(),loader=new GLTFLoader();
let renderer,scene,root,controls,camera,raf=0,auto=false,ready=false,visible=!document.hidden,revision=0,dragged=false;
let mannequinBounds=null,mannequinRealBounds=null,headBounds=null,body=null;
// Amostra a geometria original do manequim na região superior, evitando usar
// a largura dos ombros/corpo para dimensionar bonés.
function measureHead(mannequin){
 const full=mannequinRealBounds, height=full.max.y-full.min.y;
 const bands=[[.88,.965],[.86,.96],[.84,.98]];
 mannequin.updateMatrixWorld(true);
 for(const [from,to] of bands){
  const b=new THREE.Box3(), point=new THREE.Vector3();
  let count=0;
  mannequin.traverse(mesh=>{
   if(!mesh.isMesh||!mesh.geometry?.attributes?.position)return;
   const attr=mesh.geometry.attributes.position;
   const stride=Math.max(1,Math.floor(attr.count/30000));
   for(let i=0;i<attr.count;i+=stride){
    point.fromBufferAttribute(attr,i).applyMatrix4(mesh.matrixWorld);
    const fraction=(point.y-full.min.y)/height;
    if(fraction>=from&&fraction<=to){b.expandByPoint(point);count++}
   }
  });
  const dims=b.getSize(new THREE.Vector3());
  if(count>30&&dims.x>height*.045&&dims.x<height*.32&&dims.z>height*.025){
   return b;
  }
 }
 // Fallback conservador se a cabeça tiver topologia/altura incomum.
 const c=full.getCenter(new THREE.Vector3());
 return new THREE.Box3(
  new THREE.Vector3(c.x-height*.078,full.min.y+height*.86,c.z-height*.067),
  new THREE.Vector3(c.x+height*.078,full.min.y+height*.98,c.z+height*.067)
 );
}
// Measured against the original 8 GLBs from the DOTH Drive folder.
// s is a UNIFORM scalar: all original angles, seams, proportions and topology are preserved.
// y is the lower edge of the object as a fraction of the mannequin's height.
// Regiões do corpo que cada peça veste (o ajuste corpo×roupa só atua nelas). Sem isso,
// a borda de uma peça sem manga dentro do braço era tratada como braço furando a roupa.
const BODY_TORSO=1,BODY_ARM=2,BODY_HEAD=4;
// Versão dos GLBs (o manequim mudou de pose e ganhou o atributo _ARM): evita cache antigo.
const ASSET_VERSION=12;
const SOURCE_MANNEQUIN_HEIGHT=0.979522705078125;
const garmentFit={
 // Uniform scales tested with original GLBs in frontal and side views.
 // Shift jacket back without losing the natural, wide shoulder fit.
 jacket_cream:{s:.465,referenceScale:.52,y:.38,z:-.009,anchor:'collar',covers:BODY_TORSO|BODY_ARM},
 // Keep approved trousers unchanged.
 pants_cargo:{s:.56,y:0,z:0,covers:BODY_TORSO},
 pants_black:{s:.53,y:.005,z:0,covers:BODY_TORSO},
 overalls_cream:{s:.82,y:.022,z:.005,covers:BODY_TORSO},
 // Cap calibration now uses the measured head silhouette, not guessed mannequin-height multipliers.
 cap_camo:{turn:Math.PI,width:1.12,front:.07,crownDrop:.014,covers:BODY_HEAD},
 cap_plaid:{turn:Math.PI,width:1.12,front:.07,crownDrop:.014,covers:BODY_HEAD},
 cap_leopard:{turn:Math.PI,width:1.12,front:.07,crownDrop:.014,covers:BODY_HEAD}
};
function status(s){el('message').textContent=s;el('message').hidden=!s}
function send(type,data){if(parent!==window)parent.postMessage(Object.assign({source:'doth-fitting-room',type},data||{}),location.origin)}
function option(slot){return options[slot][selected[slot]]}
function drawSelectors(){el('selectors').innerHTML=slots.map(slot=>{const a=option(slot),name={hat:'01 / BONÉ',top:'02 / CAMISA',bottom:'03 / CALÇA',full:'04 / JARDINEIRA'}[slot];return '<div class="item"><div class="type">'+name+'</div><div class="switch"><button data-slot="'+slot+'" data-dir="-1" aria-label="Anterior '+name+'">←</button><div class="name">'+a.label+'</div><button data-slot="'+slot+'" data-dir="1" aria-label="Próximo '+name+'">→</button></div><div class="ref">'+(a.reference?'* GLB DE REFERÊNCIA':'&nbsp;')+'</div></div>'}).join('')}
function requestDraw(){if(visible&&!raf)raf=requestAnimationFrame(render)}
function size(){if(!renderer)return;const rect=el('scene').getBoundingClientRect();const w=Math.max(1,Math.round(rect.width)),h=Math.max(1,Math.round(rect.height));if(renderer.domElement.width!==Math.round(w*renderer.getPixelRatio())||renderer.domElement.height!==Math.round(h*renderer.getPixelRatio())){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();requestDraw()}}
function render(){raf=0;if(!visible||!ready)return;size();if(auto){root.rotation.y+=.006}controls.update();renderer.render(scene,camera);if(auto)requestDraw()}
function cloneModel(source){const obj=source.clone(true);obj.traverse(child=>{if(child.isMesh){child.material=Array.isArray(child.material)?child.material.map(m=>{const c=m.clone();c.side=THREE.DoubleSide;return c}):(()=>{const c=child.material.clone();c.side=THREE.DoubleSide;return c})();child.frustumCulled=false}});return obj}
async function asset(key){if(cache.has(key))return cloneModel(cache.get(key));if(!pending.has(key)){pending.set(key,loader.loadAsync('assets/'+key+'.glb?v='+ASSET_VERSION).then(g=>{cache.set(key,g.scene);pending.delete(key);return g.scene}).catch(e=>{pending.delete(key);throw e}))}return cloneModel(await pending.get(key))}
function positionModel(obj,slot){
 obj.updateMatrixWorld(true);
 const sourceBox=new THREE.Box3().setFromObject(obj);
 const size=sourceBox.getSize(new THREE.Vector3());
 const center=sourceBox.getCenter(new THREE.Vector3());
 if(!size.y||!Number.isFinite(size.y))throw Error('GLB inválido: dimensões não finitas');
 if(slot==='mannequin'){
  // Escala ancorada na altura ORIGINAL do manequim (do pé ao topo da cabeça antes da
  // correção de proporção): a cabeça foi reduzida em optimize_models.py, e toda a
  // calibração das roupas (garmentFit) é relativa a essa altura de referência.
  const uniform=4.7/SOURCE_MANNEQUIN_HEIGHT;
  obj.scale.setScalar(uniform);
  obj.position.set(-center.x*uniform,-(sourceBox.min.y+SOURCE_MANNEQUIN_HEIGHT/2)*uniform,-center.z*uniform);
  obj.updateMatrixWorld(true);
  mannequinRealBounds=new THREE.Box3().setFromObject(obj);
  mannequinBounds=mannequinRealBounds.clone();
  mannequinBounds.max.y=mannequinBounds.min.y+4.7;
  headBounds=measureHead(obj);
  return obj;
 }
 if(!mannequinBounds)throw Error('Manequim precisa carregar antes da roupa');
 const key=obj.userData.dothKey,fit=garmentFit[key];
 if(!fit)throw Error('Calibração ausente para '+key);
 if(slot==='hat'){
  // A largura da cabeça dirige o ajuste; um único escalar preserva o corte original.
  const headSize=headBounds.getSize(new THREE.Vector3());
  const headCenter=headBounds.getCenter(new THREE.Vector3());
  const capWidth=Math.max(size.x,size.z*.001);
  const scale=headSize.x*fit.width/capWidth;
  obj.scale.setScalar(scale);
  obj.rotation.y=fit.turn||0;
  obj.updateMatrixWorld(true);
  // Bounding box pós-rotação: inclui corretamente a aba voltada para a frente.
  const capBox=new THREE.Box3().setFromObject(obj);
  const capCenter=capBox.getCenter(new THREE.Vector3());
  const height=mannequinBounds.max.y-mannequinBounds.min.y;
  obj.position.x+=headCenter.x-capCenter.x;
  obj.position.z+=headCenter.z+headSize.z*fit.front-capCenter.z;
  // Coroa apenas acima do topo da cabeça; a aba se estende naturalmente à frente.
  obj.position.y+=mannequinRealBounds.max.y-height*(fit.crownDrop??0)-capBox.max.y;
  return obj;
 }
 const bodySize=mannequinBounds.getSize(new THREE.Vector3());
 const bodyCenter=mannequinBounds.getCenter(new THREE.Vector3());
 const uniform=bodySize.y/SOURCE_MANNEQUIN_HEIGHT*fit.s;
 // Never use set(sx,sy,sz) for a garment: independent-axis scales distort its original cut.
 obj.scale.setScalar(uniform);
 obj.rotation.y=fit.turn||0;
 const rotatedCenter=new THREE.Vector3(center.x,0,center.z).applyAxisAngle(new THREE.Vector3(0,1,0),obj.rotation.y).multiplyScalar(uniform);
 obj.position.set(
  bodyCenter.x-rotatedCenter.x,
  mannequinBounds.min.y+bodySize.y*fit.y-sourceBox.min.y*uniform,
  bodyCenter.z-rotatedCenter.z+bodySize.y*fit.z/SOURCE_MANNEQUIN_HEIGHT
 );
 if(fit.anchor==='collar'){
  // Redimensionar a jaqueta sem derrubar a gola: preservar a altura de
  // topo que tinha a calibração anterior e recolher a barra e as mangas.
  const referenceUniform=bodySize.y/SOURCE_MANNEQUIN_HEIGHT*fit.referenceScale;
  obj.position.y+=(sourceBox.max.y-sourceBox.min.y)*(referenceUniform-uniform);
 }
 return obj;
}

// ---------------------------------------------------------------------------
// Ajuste corpo × roupa: os GLBs não são rigados para o manequim, então partes
// do corpo atravessavam as peças. Em vez de distorcer as roupas, o manequim é
// "recolhido" localmente: cada vértice do corpo é testado ao longo da sua
// normal contra a superfície das peças vestidas (BVH) e, se estiver fora ou
// rente ao tecido, é empurrado para dentro até ficar BODY_GAP abaixo dele.
// Unidades: espaço local do manequim (altura ≈ 0,98).
const BODY_GAP=.004,BODY_MAX_IN=.07,BODY_FEATHER=4,BODY_SELF_NEAR=.003,BODY_SEAM=.006,BODY_HIDE_DEPTH=.02,BODY_COVERED=.15;
const bvhCache=new WeakMap();
function bvhFor(geometry){let b=bvhCache.get(geometry);if(!b){b=new MeshBVH(geometry);bvhCache.set(geometry,b)}return b}
function prepareBody(mannequin){
 let mesh=null;mannequin.traverse(c=>{if(c.isMesh&&!mesh)mesh=c});
 if(!mesh)return;
 mesh.geometry=mesh.geometry.clone();// não altera o GLB em cache
 const pos=mesh.geometry.attributes.position,nor=mesh.geometry.attributes.normal,n=pos.count;
 // Vértices duplicados em costuras de UV recebem o mesmo deslocamento (sem rachaduras).
 const groupOf=new Int32Array(n),keys=new Map(),gNormal=[];
 for(let i=0;i<n;i++){
  const k=Math.round(pos.getX(i)*2e4)+','+Math.round(pos.getY(i)*2e4)+','+Math.round(pos.getZ(i)*2e4);
  let g=keys.get(k);if(g===undefined){g=gNormal.length/3;keys.set(k,g);gNormal.push(0,0,0)}
  groupOf[i]=g;gNormal[g*3]+=nor.getX(i);gNormal[g*3+1]+=nor.getY(i);gNormal[g*3+2]+=nor.getZ(i);
 }
 const groups=gNormal.length/3,gPos=new Float32Array(groups*3),gN=new Float32Array(groups*3);
 for(let i=0;i<n;i++){const g=groupOf[i];gPos[g*3]=pos.getX(i);gPos[g*3+1]=pos.getY(i);gPos[g*3+2]=pos.getZ(i)}
 for(let g=0;g<groups;g++){const x=gNormal[g*3],y=gNormal[g*3+1],z=gNormal[g*3+2],l=Math.hypot(x,y,z)||1;gN[g*3]=x/l;gN[g*3+1]=y/l;gN[g*3+2]=z/l}
 // Vizinhança por grupo para suavizar as bordas do recolhimento.
 const idx=mesh.geometry.index,nb=Array.from({length:groups},()=>new Set());
 if(idx)for(let t=0;t<idx.count;t+=3){const a=groupOf[idx.getX(t)],b=groupOf[idx.getX(t+1)],c=groupOf[idx.getX(t+2)];nb[a].add(b).add(c);nb[b].add(a).add(c);nb[c].add(a).add(b)}
 // BVH do corpo em repouso: detecta quando o raio sai do próprio corpo (mão ao lado
 // do quadril, braço junto ao tronco) antes de chegar à roupa — nesse caso não há invasão.
 const selfGeo=new THREE.BufferGeometry();selfGeo.setAttribute('position',new THREE.BufferAttribute(pos.array.slice(),3));if(idx)selfGeo.setIndex(new THREE.BufferAttribute(idx.array.slice(),1));
 const neighbors=nb.map(s=>Int32Array.from(s));
 const self=new MeshBVH(selfGeo);
 // A malha tem regiões com normais invertidas. Orientação: a normal certa é a direção
 // pela qual o raio escapa do corpo sem tocá-lo; em concavidades (os dois lados batem),
 // vale a paridade — cruzar o corpo um número ímpar de vezes indica normal para dentro.
 {
  const r=new THREE.Ray(),flip=new Uint8Array(groups);
  for(let g=0;g<groups;g++){
   const nx=gN[g*3],ny=gN[g*3+1],nz=gN[g*3+2];
   r.origin.set(gPos[g*3],gPos[g*3+1],gPos[g*3+2]);
   r.direction.set(nx,ny,nz);const fwd=self.raycast(r,THREE.DoubleSide,BODY_SELF_NEAR*.5,3).length;
   if(!fwd)continue;// escapa pela normal: já aponta para fora
   r.direction.set(-nx,-ny,-nz);const back=self.raycast(r,THREE.DoubleSide,BODY_SELF_NEAR*.5,3).length;
   flip[g]=back===0?1:(fwd&1);
  }
  // Voto da vizinhança: corrige vértices isolados onde o teste falha (cascas sobrepostas).
  const vote=flip.slice();
  for(let g=0;g<groups;g++){const list=neighbors[g];if(!list.length)continue;let c=flip[g];for(let j=0;j<list.length;j++)c+=flip[list[j]];vote[g]=c*2>list.length+1?1:0}
  for(let g=0;g<groups;g++)if(vote[g]){gN[g*3]*=-1;gN[g*3+1]*=-1;gN[g*3+2]*=-1}
 }
 // A malha (Tripo, decimada) tem normais ruidosas: suaviza a direção usada para
 // empurrar, senão vértices vizinhos se separam e formam "lascas".
 for(let it=0;it<8;it++){
  const next=gN.slice();
  for(let g=0;g<groups;g++){
   const list=neighbors[g];let x=gN[g*3],y=gN[g*3+1],z=gN[g*3+2];
   for(let j=0;j<list.length;j++){const q=list[j]*3;x+=gN[q];y+=gN[q+1];z+=gN[q+2]}
   const l=Math.hypot(x,y,z);if(l>1e-6){next[g*3]=x/l;next[g*3+1]=y/l;next[g*3+2]=z/l}
  }
  gN.set(next);
 }
 const thickness=new Float32Array(groups),r=new THREE.Ray();
 // Espessura local ao longo da normal: o recolhimento nunca atravessa a casca.
 for(let g=0;g<groups;g++){
  r.origin.set(gPos[g*3],gPos[g*3+1],gPos[g*3+2]);r.direction.set(-gN[g*3],-gN[g*3+1],-gN[g*3+2]);
  const h=self.raycastFirst(r,THREE.DoubleSide,BODY_SELF_NEAR,.2);thickness[g]=h?h.distance:.2;
 }
 // Região de cada vértice: braço pelo peso _ARM gravado no GLB (o mesmo da pose em
 // optimize_models.py), cabeça pela altura de referência, o resto é tronco/pernas.
 const region=new Uint8Array(groups),armAttr=mesh.geometry.attributes._arm;
 let minY=Infinity,maxY=-Infinity;for(let g=0;g<groups;g++){minY=Math.min(minY,gPos[g*3+1]);maxY=Math.max(maxY,gPos[g*3+1])}
 for(let i=0;i<n;i++){const g=groupOf[i];const hRef=(gPos[g*3+1]-minY)/SOURCE_MANNEQUIN_HEIGHT;
  region[g]|=armAttr&&armAttr.getX(i)>.5?BODY_ARM:hRef>.855?BODY_HEAD:BODY_TORSO}

}
// Classifica o caminho do raio dentro do corpo até a roupa:
// 0 = não sai do corpo antes da roupa (invasão → recolher/ocultar);
// 1 = sai para o ar (mão ao lado do quadril → não mexer);
// 2 = sai de uma casca e entra noutra (emenda do manequim articulado, p.ex. ombro).
function pathThroughBody(self,r,px,py,pz,dx,dy,dz,limit){
 r.origin.set(px,py,pz);r.direction.set(dx,dy,dz);
 const exit=self.raycastFirst(r,THREE.DoubleSide,BODY_SELF_NEAR,limit);
 if(!exit)return 0;
 const reenter=self.raycastFirst(r,THREE.DoubleSide,exit.distance+1e-5,exit.distance+BODY_SEAM);
 return reenter?2:1;
}
function conformBody(){
 if(!body)return;
 const {mesh,self,thickness,region,restIndex,rest,groupOf,gPos,gN,neighbors}=body,pos=mesh.geometry.attributes.position,groups=gN.length/3;
 const push=new Float32Array(groups),hidden=new Uint8Array(groups),covered=new Float32Array(groups),candidate=new Uint8Array(groups),toAir=new Uint8Array(groups);
 root.updateMatrixWorld(true);
 const bodyInv=new THREE.Matrix4().copy(mesh.matrixWorld).invert();

function disposeClone(obj){if(!obj)return;obj.traverse(c=>{if(c.isMesh){const mats=Array.isArray(c.material)?c.material:[c.material];mats.forEach(m=>m.dispose())}});root.remove(obj)}
